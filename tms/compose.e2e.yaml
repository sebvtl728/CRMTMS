# End-to-end test stack, layered on compose.yaml:
#   docker compose -f compose.yaml -f compose.e2e.yaml up -d app-e2e caddy-e2e
# Same image and source as the dev app, but its own database (tms_e2e), tenant
# ("e2e"), port (8081) and cookie: the dev data is never touched.
services:
  app-e2e:
    image: tms-app:dev # built by the dev stack (docker compose build app)
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gotenberg: # quote PDF (compose.yaml service, same network)
        condition: service_started
    environment:
      DB_DATABASE: tms_e2e
      TMS_MODE: single
      TMS_DEFAULT_TENANT: e2e
      APP_URL: http://localhost:8081
      SESSION_COOKIE: tms_e2e_session
      CACHE_PREFIX: tms_e2e_
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      TMS_VITE_HOT: "false" # serve public/build, not the Vite dev server

  caddy-e2e:
    image: caddy:2
    ports:
      - "8081:80"
    volumes:
      - ./tests/e2e/Caddyfile:/etc/caddy/Caddyfile:ro
      - .:/var/www/html:ro
    depends_on:
      - app-e2e
