# Production stack. Required variables come from .env (see .env.prod.example);
# the installer generates it. Only caddy publishes ports (80/443).
name: tms

# tag@digest when the release pins its image (TMS_IMAGE_DIGEST from the verified bundle): Docker
# pulls by digest and refuses any other content; the tag alone for local builds.
x-app-image: &app-image ${TMS_IMAGE:-ghcr.io/${TMS_IMAGE_OWNER:-OWNER}/tms}:${TMS_VERSION:?TMS_VERSION is required}${TMS_IMAGE_DIGEST:+@${TMS_IMAGE_DIGEST}}

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-TMS}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_URL: https://${TMS_DOMAIN:?TMS_DOMAIN is required}
  APP_VERSION: ${TMS_VERSION}
  APP_TIMEZONE: Europe/Paris
  APP_LOCALE: fr
  APP_FALLBACK_LOCALE: fr
  TMS_MODE: ${TMS_MODE:-single}
  TMS_DEFAULT_TENANT: ${TMS_DEFAULT_TENANT:-default}
  TMS_ALERT_EMAIL: ${TMS_ALERT_EMAIL:-}
  TMS_ALLOW_INTERNAL_SMTP_HOSTS: "false"
  TMS_ALLOW_PRIVATE_SMTP_HOSTS: ${TMS_ALLOW_PRIVATE_SMTP_HOSTS:-}
  # Only the Caddy container may set X-Forwarded-* (HTTPS detection, client IP).
  TRUSTED_PROXIES: ${TMS_CADDY_IP:-172.29.250.10}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: tms
  DB_USERNAME: tms_app
  DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
  # No owner credentials here: migrations run through ops/migrate.sh (one-off container).
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  SESSION_DOMAIN: "null"
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@localhost}
  MAIL_FROM_NAME: ${APP_NAME:-TMS}

x-app: &app
  image: *app-image
  restart: unless-stopped
  environment:
    <<: *app-env
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - tms

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      TMS_PUBLIC_SYNC: /srv/public
    volumes:
      - storage:/var/www/html/storage
      - public:/srv/public
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *app
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q 'is running'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'schedule[:]work' /proc/[0-9]*/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${TMS_HTTP_PORT:-80}:80"
      - "${TMS_HTTPS_PORT:-443}:443"
      - "${TMS_HTTPS_PORT:-443}:443/udp"
    environment:
      TMS_DOMAIN: ${TMS_DOMAIN}
      TMS_ACME_EMAIL: ${TMS_ACME_EMAIL:?TMS_ACME_EMAIL is required}
      TMS_TLS: ${TMS_TLS:-acme}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - public:/srv/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # Caddy itself (the application is checked by ops/lib.sh wait_health on /health).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/alive"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      tms:
        ipv4_address: ${TMS_CADDY_IP:-172.29.250.10}

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      INIT_SQL: /opt/tms/init.sql
      TMS_NO_TEST_DB: "1"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./docker/postgres/init.sql:/opt/tms/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d tms"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tms

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tms

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - tms

volumes:
  pgdata:
  redisdata:
  storage:
  public:
  caddy_data:
  caddy_config:

networks:
  tms:
    ipam:
      config:
        - subnet: ${TMS_NET_SUBNET:-172.29.250.0/24}
