name: tms

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    target: dev
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: tms-app:dev
  volumes:
    - .:/var/www/html
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    gotenberg:
      condition: service_started

services:
  app:
    <<: *app

  caddy:
    image: caddy:2
    ports:
      - "8080:80"
    volumes:
      - ./docker/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - .:/var/www/html:ro
    depends_on:
      - app

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      INIT_SQL: /opt/tms/init.sql
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./docker/postgres/init.sql:/opt/tms/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7

  # HTML -> PDF (quotes). Internal only: no published port. Chromium without
  # JavaScript nor outbound access (documents are self-contained); unused routes off.
  gotenberg:
    image: gotenberg/gotenberg:8.40
    command: ["gotenberg",
      "--chromium-disable-javascript=true",
      "--chromium-deny-public-ips=true",
      "--chromium-deny-private-ips=true",
      "--api-disable-download-from=true",
      "--webhook-disable=true",
      "--libreoffice-disable-routes=true",
      "--pdfengines-disable-routes=true"]

  worker:
    <<: *app
    command: php artisan horizon

  scheduler:
    <<: *app
    command: php artisan schedule:work

  vite:
    image: node:22
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules

volumes:
  postgres-data:
  node-modules:
