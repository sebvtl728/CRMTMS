name: release

# Publishes a version when a tag vMAJOR.MINOR.PATCH[-prerelease] is pushed:
#   - image ghcr.io/<owner>/tms:<version> (amd64 + arm64), :latest unless pre-release, signed with cosign (keyless)
#   - GitHub Release with tms-<version>.tar.gz, SHA256SUMS (+ cosign bundle), install.sh, proxmox.sh
# Contract with the installer/updater: tms/docs/install.md ("Contenu d'une version"); how to cut one: docs/release.md.
#
# Actions are pinned to major versions (like ci.yml); Dependabot may bump them. For a stricter
# supply chain, replace each tag by the full commit SHA.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless (OIDC)
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and image name
        id: meta
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"; exit 1
          fi
          version="${TAG#v}"
          core="${BASH_REMATCH[1]}"
          if [[ "$core" != "$(tr -d '[:space:]' < tms/VERSION)" ]]; then
            echo "::error::Tag $TAG does not match tms/VERSION ($(cat tms/VERSION)); bump VERSION and CHANGELOG first."; exit 1
          fi
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          image="ghcr.io/${OWNER,,}/tms"
          tags="$image:$version"
          [[ "$prerelease" == true ]] || tags="$tags"$'\n'"$image:latest"
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "image=$image"
            echo "tags<<EOF"; echo "$tags"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64, arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: tms
          file: tms/docker/app.Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # cosign keyless (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Build bundle and SHA256SUMS
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: tms/ops/release/make-bundle.sh "$VERSION" dist

      - uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS (keyless)
        # SHA256SUMS lists the archive, install.sh and proxmox.sh: one signature covers all of them.
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.image.outputs.version }}
          PRERELEASE: ${{ needs.image.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes "${flags[@]}" \
            "dist/tms-$VERSION.tar.gz" dist/SHA256SUMS dist/SHA256SUMS.cosign.bundle dist/install.sh dist/proxmox.sh
