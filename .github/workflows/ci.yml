name: ci

on:
  push:
    branches: [main, lot1a-socle]
  pull_request:
  workflow_call: # reused by release.yml: a tag is published only if this passes

defaults:
  run:
    working-directory: tms

jobs:
  php:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_TIMEZONE: Europe/Paris
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: tms_test
      DB_USERNAME: tms_app
      DB_OWNER_USERNAME: tms_owner
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      # Quote PDF: the real converter for the slow group (QuotePdfTest).
      GOTENBERG_URL: http://127.0.0.1:3000
      # Throwaway credentials of the ephemeral CI database service only.
      POSTGRES_USER: postgres
      PGHOST: 127.0.0.1
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      gotenberg:
        image: gotenberg/gotenberg:8.40
        ports:
          - 3000:3000
        options: >-
          --health-cmd "curl -fsS -o /dev/null http://127.0.0.1:3000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, zip, gd, bcmath, pcntl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tms/package-lock.json

      - name: Install pdftotext (AI assistant reads PDF programmes, as in the image)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Create roles and databases
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "DB_OWNER_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: bash docker/postgres/init.sh
        env:
          PGPASSWORD: ci-superuser
          POSTGRES_OWNER_PASSWORD: ${{ env.DB_OWNER_PASSWORD }}
          POSTGRES_APP_PASSWORD: ${{ env.DB_PASSWORD }}

      - run: composer install --no-interaction --no-progress --prefer-dist
      # Empty .env: the configuration comes from the job environment and the
      # config/ defaults (no secret in the repository). Without the file,
      # phpdotenv's failed read is reported as a warning by every test.
      - run: touch .env
      - run: npm ci
      - run: npm run build

      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      # No --parallel: tms_app cannot create the per-process databases.
      - run: php artisan test
      # Volume tests and the real PDF conversion (excluded from the default run, phpunit.xml).
      - run: php artisan test --group=slow

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tms/package-lock.json
      # ziggy-js is resolved from the PHP package (tsconfig paths: vendor/tightenco/ziggy).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, zip, gd, bcmath, pcntl
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # --locked: audit composer.lock without installing the packages.
      - run: composer audit --locked --abandoned=report
      # Production dependencies only: the remaining high findings are dev-toolchain transitives (eslint chain).
      - run: npm audit --omit=dev --audit-level=high

  shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tms
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (skipped while ops/ does not exist)
        run: |
          if [ ! -d ops ]; then
            echo "No ops/ directory yet, nothing to check."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y shellcheck
          find ops \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 -r shellcheck -x
          shellcheck -x docker/entrypoint.sh
      - name: actionlint (workflows)
        working-directory: .
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # Backup/restore against a production-like stack (compose.prod.yaml, image built locally).
  shell-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tms
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: bats integration tests
        run: bats ops/tests
